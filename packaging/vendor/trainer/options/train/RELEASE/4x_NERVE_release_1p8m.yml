# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
#########################################################################################
# NERVE 4x release training (clean bicubic fidelity)
#
# Canonical NERVE: norm-free, dim 48, n_blocks 16, ~688K params. Pure conv, no
# attention, no normalization. Trained on LUCID CC0 v2 HC-512 (license-clean)
# paired with chainner CubicCatrom lr_x4. This is the fidelity tier; the OTF
# fidelity + GAN configs fine-tune on top of this family of weights.
#
# Warm start (EDSR-style multi-scale init) from the 2x release body:
# train 2x_NERVE_release.yml first, then this file loads its body weights;
# strict_load_g: false resets the scale-specific PixelShuffle head.
#
# No window-alignment constraints (NERVE has no attention windows), so crop
# size and batch are free to pick for throughput; lq 96 matches the HEART
# pipeline for comparability.
#########################################################################################
name: 4x_NERVE_release_1p8m
scale: 4
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: true
compile_mode: default  # conv-only net: 'default' is stable and export-safe
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: LUCID Train
    type: pairedimagedataset
    dataroot_gt: [datasets/train/lucid_hc512/hr]
    dataroot_lq: [datasets/train/lucid_hc512/lr_x4]
    lq_size: 96
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: Urban100 Val
    type: pairedimagedataset
    dataroot_gt: [datasets/val/urban100/hr]
    dataroot_lq: [datasets/val/urban100/lr_x4]
    filename_tmpl: "{}x4"

network_g:
  type: nerve
  dim: 64
  n_blocks: 24

path:
  pretrain_network_g: experiments/warmstart/nerve_d64_b24_from_4xrelease.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [100000, 160000]
    gamma: 0.5
  total_iter: 200000
  warmup_iter: -1
  losses:
    - type: charbonnierloss
      loss_weight: 1.0

val:
  val_enabled: true
  val_freq: 5000
  save_img: false  # disk-safe: metrics only; visuals on demand via inference scripts
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true


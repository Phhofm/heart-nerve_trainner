# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
#########################################################################################
# NERVE 2x release training (clean bicubic fidelity)
#
# Canonical NERVE: norm-free, dim 48, n_blocks 16, ~672K params (2x head is
# smaller than 4x). Trained on LUCID CC0 v2 HC-512 (license-clean) paired with
# chainner CubicCatrom lr_x2. This is also the warm start for the 4x release:
# the 4x run loads this model's BODY weights (strict_load_g: false resets the
# scale-specific PixelShuffle head).
#########################################################################################
name: 2x_NERVE_release
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: true
compile_mode: default
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: LUCID Train
    type: pairedimagedataset
    dataroot_gt: [datasets/train/lucid_hc512/hr]
    dataroot_lq: [datasets/train/lucid_hc512/lr_x2]
    lq_size: 96
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: Urban100 Val
    type: pairedimagedataset
    dataroot_gt: [datasets/val/urban100/hr]
    dataroot_lq: [datasets/val/urban100/lr_x2]
    filename_tmpl: "{}x2"

network_g:
  type: nerve
  dim: 48
  n_blocks: 16

path:
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [200000, 350000, 450000]
    gamma: 0.5
  total_iter: 500000
  warmup_iter: -1
  losses:
    - type: charbonnierloss
      loss_weight: 1.0

val:
  val_enabled: true
  val_freq: 5000
  save_img: false  # disk-safe: metrics only; visuals on demand via inference scripts
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true

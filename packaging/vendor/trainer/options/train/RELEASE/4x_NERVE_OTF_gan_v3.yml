# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
#########################################################################################
# NERVE 4x OTF GAN v3 — recipe isolation run
#
# GAN v2 (weak base + phase-jittered GAN degradation) produced ~15-35% more
# high-freq grain than GAN v1. This run isolates the cause with a single change
# vs GAN v1:
#   * strong base: v1 OTF fidelity 135k (21.95 dB — the strongest OTF base)
#   * NO lq_phase_jitter (phase jitter destabilizes the GAN stage)
#   * anti-aliased final resize-back only (nearest-exact removed — the aliased
#     LR that invites hallucinated texture)
# Same losses/recipe as GAN v1 otherwise. If artifacts drop -> jitter and/or
# the weak v2 base caused the regression; capacity is then optional.
#########################################################################################
name: 4x_NERVE_OTF_gan_v3
scale: 4
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false  # keep default: inductor errors on discriminator step
compile_mode: default
num_gpu: auto
manual_seed: 1024

high_order_degradation: true
high_order_degradations_debug: false
high_order_degradations_debug_limit: 100

lq_usm: true
lq_usm_radius_range: [1, 25]

lq_phase_jitter: false

blur_prob: 0.6
resize_prob: [0.2, 0.7, 0.1]
resize_mode_list: ['bilinear', 'bicubic', 'nearest-exact', 'lanczos']
resize_mode_prob: [0.25, 0.25, 0.25, 0.25]
resize_range: [0.4, 1.5]
gaussian_noise_prob: 0.4
noise_range: [1, 15]
poisson_scale_range: [0.05, 2]
gray_noise_prob: 0.1
jpeg_prob: 0.4
jpeg_range: [40, 95]

blur_prob2: 0.3
resize_prob2: [0.3, 0.4, 0.3]
resize_mode_list2: ['bilinear', 'bicubic', 'nearest-exact', 'lanczos']
resize_mode_prob2: [0.25, 0.25, 0.25, 0.25]
resize_range2: [0.6, 1.2]
gaussian_noise_prob2: 0.3
noise_range2: [1, 10]
poisson_scale_range2: [0.05, 1.5]
gray_noise_prob2: 0.05
jpeg_prob2: 0.3
jpeg_range2: [40, 95]

# anti-aliased final resize-back only
resize_mode_list3: ['bilinear', 'bicubic', 'nearest-exact', 'lanczos']
resize_mode_prob3: [0.25, 0.25, 0.25, 0.25]

queue_size: 120

datasets:
  train:
    name: LUCID OTF Train
    type: realesrgandataset
    dataroot_gt: [datasets/train/lucid_hc512/hr]

    blur_kernel_size: 12
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    kernel_range: [5, 17]
    blur_sigma: [0.2, 2]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 12
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    kernel_range2: [5, 17]
    blur_sigma2: [0.2, 1]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_kernel_range: [5, 17]

    lq_size: 96
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    accum_iter: 1

  val:
    name: Urban100 OTF Val
    type: pairedimagedataset
    dataroot_gt: [datasets/val/urban100/hr]
    dataroot_lq: [datasets/val/urban100_otf_x4]

network_g:
  type: nerve
  dim: 48
  n_blocks: 16

network_d:
  type: dunet

path:
  pretrain_network_g: experiments/4x_NERVE_OTF_fidelity/models/net_g_ema_135000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [75000, 120000]
    gamma: 0.5
  total_iter: 150000
  warmup_iter: -1
  losses:
    - type: mssimloss
      loss_weight: 0.5
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: hsluvloss
      criterion: charbonnier
      loss_weight: 1.0
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.1

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    topiq:
      type: calculate_topiq
    lpips:
      type: calculate_lpips
      better: lower

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true

# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
#########################################################################################
# HEART 4x OTF v2 (lq 96) — window-aligned fidelity pretrain for GAN finetunes
#
# Replaces the v1.1 lq-80 run as the canonical OTF fidelity pretrain. Root-cause
# fix: lq_size 96 (= 3 x 32px window) keeps every attention window on real
# content during training. The lq-80 crop forced the model to reflect-pad its
# own bottom/right edge every batch, teaching a "mirror at edge" response that
# shows up as a bright band / tile grid (and that the GAN loss amplifies).
#
# Starts from the finished v1.1 weights (backup_otf_v2, 150k). Same degradation
# + losses as v1.1, only the crop size changes.
#########################################################################################
name: 4x_otf_fidelity
scale: 4
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: true
compile_mode: reduce-overhead
num_gpu: auto
# manual_seed: 1024  # commented: random seed per run

high_order_degradation: true
high_order_degradations_debug: false
high_order_degradations_debug_limit: 100

lq_usm: true
lq_usm_radius_range: [1, 25]

# Degradation identical to v1.1
blur_prob: 0.6
resize_prob: [0.2, 0.7, 0.1]
resize_mode_list: ['bilinear', 'bicubic', 'nearest-exact', 'lanczos']
resize_mode_prob: [0.25, 0.25, 0.25, 0.25]
resize_range: [0.4, 1.5]
gaussian_noise_prob: 0.4
noise_range: [1, 15]
poisson_scale_range: [0.05, 2]
gray_noise_prob: 0.1
jpeg_prob: 0.4
jpeg_range: [40, 95]

blur_prob2: 0.3
resize_prob2: [0.3, 0.4, 0.3]
resize_mode_list2: ['bilinear', 'bicubic', 'nearest-exact', 'lanczos']
resize_mode_prob2: [0.25, 0.25, 0.25, 0.25]
resize_range2: [0.6, 1.2]
gaussian_noise_prob2: 0.3
noise_range2: [1, 10]
poisson_scale_range2: [0.05, 1.5]
gray_noise_prob2: 0.05
jpeg_prob2: 0.3
jpeg_range2: [40, 95]

resize_mode_list3: ['bilinear', 'bicubic', 'nearest-exact', 'lanczos']
resize_mode_prob3: [0.25, 0.25, 0.25, 0.25]

queue_size: 120

datasets:
  train:
    name: LUCID OTF Train
    type: realesrgandataset
    dataroot_gt: [datasets/train/lucid_hc512/hr]

    blur_kernel_size: 12
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    kernel_range: [5, 17]
    blur_sigma: [0.2, 2]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 12
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    kernel_range2: [5, 17]
    blur_sigma2: [0.2, 1]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_kernel_range: [5, 17]

    lq_size: 96          # = 3 x 32px window — window-aligned, no learned edge response
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2
    accum_iter: 1

  val:
    name: Urban100 OTF Val
    type: pairedimagedataset
    dataroot_gt: [datasets/val/urban100/hr]
    dataroot_lq: [datasets/val/urban100_otf_x4]

network_g:
  type: heart
  use_checkpoint: false

path:
  pretrain_network_g: ~  # the GUI injects the official fidelity pretrain here
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [50000, 100000]
    gamma: 0.5
  total_iter: 150000
  warmup_iter: -1
  losses:
    - type: charbonnierloss
      loss_weight: 1.0
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: mssimloss
      loss_weight: 0.5

val:
  val_enabled: true
  val_freq: 5000
  save_img: true
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true

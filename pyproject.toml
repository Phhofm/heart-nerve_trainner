[project]
name = "sisr-body-studio"
version = "0.1.4"
description = "A beginner-first GUI for training SISR BODY suite models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "PyYAML>=6",
  "psutil>=5.9",
  "safetensors>=0.4",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# Training/export deps (installed into the isolated venv by the bootstrap, too).
train = ["torch", "torchvision", "onnx>=1.16", "onnxsim>=0.4", "onnxruntime>=1.17",
         "onnxconverter-common>=1.14", "pnnx", "ncnn"]
dev = ["pytest>=7"]

[project.scripts]
hnt = "hnt.cli:main"
sisr-body-studio = "hnt.ui:run"

[tool.setuptools.packages.find]
include = ["hnt*"]

[tool.setuptools.package-data]
hnt = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running end-to-end smoke tests",
]

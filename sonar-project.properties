# SonarQube (via sonarless) scans this file set. The vendored traiNNer
# fork under packaging/vendor is upstream third-party code, committed
# intentionally for self-contained builds — its findings are not this
# repo's to fix, so it stays out of the scan (onboarding finding
# 2026-11-27: 375 of 414 SonarQube findings came from the vendor tree).
sonar.exclusions=**/packaging/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/android/**,**/ios/**
sonar.sourceEncoding=UTF-8
